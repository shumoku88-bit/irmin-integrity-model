name: Irmin repro

on:
  push:
    branches:
      - research/minimal-index-integrity
  workflow_dispatch:

jobs:
  repro-2369:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout model repo
        uses: actions/checkout@v4

      - name: Checkout pinned Irmin
        uses: actions/checkout@v4
        with:
          repository: mirage/irmin
          ref: 7a09a06fff67bc4981faca36a332c51fc16e819e
          path: irmin

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          opam-pin: false

      - name: Install Irmin build dependencies
        working-directory: irmin
        run: |
          opam install ./ppx_irmin.opam ./irmin.opam ./irmin-pack.opam --deps-only -y

      - name: Add configuration matrix reproducer
        working-directory: irmin
        shell: bash
        run: |
          mkdir -p repro2369
          cat > repro2369/dune <<'EOF'
          (executable
           (name repro2369)
           (libraries irmin irmin.unix irmin-pack.unix logs lwt.unix)
           (preprocess
            (pps ppx_irmin)))
          EOF

          cat > repro2369/repro2369.ml <<'EOF'
          open Lwt.Syntax

          module Custom_contents = struct
            type t = {
              name : string;
              deck : string list;
              reveal : [ `Everyone | `SpectatorsOnly ];
            }
            [@@deriving irmin]

            let merge = Irmin.Merge.(option (idempotent t))
          end

          module Varint_conf = struct
            let entries = 32
            let stable_hash = 256
            let contents_length_header = Some `Varint
            let inode_child_order = `Seeded_hash
            let forbid_empty_dir_persistence = true
          end

          module None_conf = struct
            let entries = 32
            let stable_hash = 256
            let contents_length_header = None
            let inode_child_order = `Seeded_hash
            let forbid_empty_dir_persistence = true
          end

          module Custom_varint_maker = Irmin_pack_unix.KV (Varint_conf)
          module Custom_varint = Custom_varint_maker.Make (Custom_contents)
          module Custom_none_maker = Irmin_pack_unix.KV (None_conf)
          module Custom_none = Custom_none_maker.Make (Custom_contents)
          module String_varint_maker = Irmin_pack_unix.KV (Varint_conf)
          module String_varint = String_varint_maker.Make (Irmin.Contents.String)

          let custom_value =
            Custom_contents.
              {
                name = "alpha";
                deck = [ "one"; "two"; "three" ];
                reveal = `Everyone;
              }

          let custom_equal = Irmin.Type.(unstage (equal Custom_contents.t))
          let custom_to_bin = Irmin.Type.(unstage (to_bin_string Custom_contents.t))

          let print_custom_encoding () =
            let bin = custom_to_bin custom_value in
            let first = Char.code bin.[0] in
            Printf.printf "ENCODED_LENGTH %d\n%!" (String.length bin);
            Printf.printf "FIRST_BYTE %d\n%!" first;
            Printf.printf "VARINT_CONTRACT_ONE_BYTE %b\n%!"
              (first = String.length bin - 1)

          let run_custom_varint ~name ~strategy =
            let root = "_build/" ^ name in
            let config ~fresh = Irmin_pack.config ~fresh ~indexing_strategy:strategy root in
            let* repo = Custom_varint.Repo.v (config ~fresh:true) in
            let* store = Custom_varint.main repo in
            let* () =
              Custom_varint.set_exn ~info:(fun () -> Custom_varint.Info.empty)
                store [ "k" ] custom_value
            in
            let* same = Custom_varint.get store [ "k" ] in
            if not (custom_equal same custom_value) then failwith "same-repo mismatch";
            let* () = Custom_varint.Repo.close repo in
            let* repo2 = Custom_varint.Repo.v (config ~fresh:false) in
            let* store2 = Custom_varint.main repo2 in
            let* reopened = Custom_varint.get store2 [ "k" ] in
            if not (custom_equal reopened custom_value) then failwith "reopen mismatch";
            Custom_varint.Repo.close repo2

          let run_custom_none ~name ~strategy =
            let root = "_build/" ^ name in
            let config ~fresh = Irmin_pack.config ~fresh ~indexing_strategy:strategy root in
            let* repo = Custom_none.Repo.v (config ~fresh:true) in
            let* store = Custom_none.main repo in
            let* () =
              Custom_none.set_exn ~info:(fun () -> Custom_none.Info.empty)
                store [ "k" ] custom_value
            in
            let* same = Custom_none.get store [ "k" ] in
            if not (custom_equal same custom_value) then failwith "same-repo mismatch";
            let* () = Custom_none.Repo.close repo in
            let* repo2 = Custom_none.Repo.v (config ~fresh:false) in
            let* store2 = Custom_none.main repo2 in
            let* reopened = Custom_none.get store2 [ "k" ] in
            if not (custom_equal reopened custom_value) then failwith "reopen mismatch";
            Custom_none.Repo.close repo2

          let run_string_varint ~name ~strategy =
            let root = "_build/" ^ name in
            let config ~fresh = Irmin_pack.config ~fresh ~indexing_strategy:strategy root in
            let* repo = String_varint.Repo.v (config ~fresh:true) in
            let* store = String_varint.main repo in
            let value = "hello-world" in
            let* () =
              String_varint.set_exn ~info:(fun () -> String_varint.Info.empty)
                store [ "k" ] value
            in
            let* same = String_varint.get store [ "k" ] in
            if not (String.equal same value) then failwith "same-repo mismatch";
            let* () = String_varint.Repo.close repo in
            let* repo2 = String_varint.Repo.v (config ~fresh:false) in
            let* store2 = String_varint.main repo2 in
            let* reopened = String_varint.get store2 [ "k" ] in
            if not (String.equal reopened value) then failwith "reopen mismatch";
            String_varint.Repo.close repo2

          let observe name f =
            Lwt.catch
              (fun () ->
                let+ () = f () in
                Printf.printf "RESULT %s PASS\n%!" name)
              (fun exn ->
                Printf.printf "RESULT %s FAIL %s\n%!" name (Printexc.to_string exn);
                Lwt.return_unit)

          let run () =
            print_custom_encoding ();
            let* () =
              observe "string-varint-minimal" (fun () ->
                run_string_varint ~name:"string-varint-minimal"
                  ~strategy:Irmin_pack.Indexing_strategy.minimal)
            in
            let* () =
              observe "custom-varint-minimal" (fun () ->
                run_custom_varint ~name:"custom-varint-minimal"
                  ~strategy:Irmin_pack.Indexing_strategy.minimal)
            in
            let* () =
              observe "custom-varint-minimal-with-contents" (fun () ->
                run_custom_varint ~name:"custom-varint-minimal-with-contents"
                  ~strategy:Irmin_pack.Indexing_strategy.minimal_with_contents)
            in
            let* () =
              observe "custom-varint-always" (fun () ->
                run_custom_varint ~name:"custom-varint-always"
                  ~strategy:Irmin_pack.Indexing_strategy.always)
            in
            let* () =
              observe "custom-none-minimal" (fun () ->
                run_custom_none ~name:"custom-none-minimal"
                  ~strategy:Irmin_pack.Indexing_strategy.minimal)
            in
            observe "custom-none-always" (fun () ->
              run_custom_none ~name:"custom-none-always"
                ~strategy:Irmin_pack.Indexing_strategy.always)

          let () = Lwt_main.run (run ())
          EOF

      - name: Build matrix
        working-directory: irmin
        run: opam exec -- dune build repro2369/repro2369.exe

      - name: Run matrix
        working-directory: irmin
        shell: bash
        run: |
          set -euo pipefail
          opam exec -- dune exec repro2369/repro2369.exe | tee /tmp/repro-matrix.log

          grep -F 'VARINT_CONTRACT_ONE_BYTE false' /tmp/repro-matrix.log
          grep -F 'RESULT string-varint-minimal PASS' /tmp/repro-matrix.log
          grep -F 'RESULT custom-varint-minimal FAIL' /tmp/repro-matrix.log
          grep -F 'RESULT custom-none-minimal FAIL' /tmp/repro-matrix.log
          grep -F 'RESULT custom-none-always PASS' /tmp/repro-matrix.log
